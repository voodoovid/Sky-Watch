name: Download target thumbnails
on:
  workflow_dispatch:
  push:
    paths:
      - tools/get-heroes-models.sh
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download thumbnails
        run: bash tools/get-thumbs.sh && bash tools/get-heroes.sh && bash tools/get-heroes-models.sh
      - name: Save them to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add thumbs heroes
          git diff --cached --quiet || git commit -m "Add target images"
          git pull --rebase origin main
          git push
