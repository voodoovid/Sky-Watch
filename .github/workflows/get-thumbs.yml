name: Download target thumbnails
on:
  workflow_dispatch:
  push:
    paths:
      - tools/hero-models.txt
      - tools/get-heroes-models.sh
permissions:
  contents: write
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: [s30, s50pro, s30pro]
    steps:
      - uses: actions/checkout@v4
      - name: Download ${{ matrix.model }} images in batches and save each batch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          save() { git add "heroes/${{ matrix.model }}"; git diff --cached --quiet || { git commit -q -m "Add ${{ matrix.model }} target images"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done; }; }
          while true; do
            timeout 600 bash tools/get-heroes-models.sh "${{ matrix.model }}" | tee /tmp/dl.log || true
            save
            grep -q "^ok" /tmp/dl.log || break
          done
