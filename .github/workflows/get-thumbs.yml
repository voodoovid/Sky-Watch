name: Download target thumbnails
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download thumbnails
        run: bash tools/get-thumbs.sh
      - name: Save them to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add thumbs
          git diff --cached --quiet || git commit -m "Add target thumbnails"
          git push
